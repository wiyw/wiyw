<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="t d">
  <title id="t">Greyson — systems engineer and reverse engineer</title>
  <desc id="d">Animated orbital emblem with a glowing core, twinkling stars and a gradient nameplate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050810"/>
      <stop offset="0.5" stop-color="#0a1220"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#00ffc8" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#00b3ff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#00b3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#7df9ff"/>
      <stop offset="1" stop-color="#00b3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ffc8"/>
      <stop offset="0.5" stop-color="#7df9ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00b3ff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ffc8"/>
      <stop offset="0.48" stop-color="#7df9ff"/>
      <stop offset="1" stop-color="#00b3ff"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ffc8" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#7df9ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00b3ff" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2a3a" stroke-width="0.6" opacity="0.35"/>
    </pattern>
    <clipPath id="ul"><rect x="360" y="132" width="388" height="2"/></clipPath>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#grid)"/>
  <ellipse cx="210" cy="130" rx="230" ry="230" fill="url(#halo)"/>

  <g fill="#7df9ff">
    <circle cx="66" cy="42" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="128" cy="216" r="1.1"><animate attributeName="opacity" values="1;0.1;1" dur="4.3s" repeatCount="indefinite"/></circle>
    <circle cx="336" cy="54" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="486" cy="36" r="1.0"><animate attributeName="opacity" values="0.9;0.15;0.9" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="742" cy="222" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="4.9s" repeatCount="indefinite"/></circle>
    <circle cx="912" cy="58" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="1128" cy="176" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="1160" cy="44" r="1.0"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="48" cy="132" r="1.0"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="5.2s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(210 130)">
    <circle r="104" fill="none" stroke="url(#ring)" stroke-width="1" stroke-dasharray="3 9" opacity="0.65">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle r="76" fill="none" stroke="url(#ring)" stroke-width="1.2" opacity="0.75"/>
    <circle r="46" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity="0.9" stroke-dasharray="46 30">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="22" fill="url(#core)" opacity="0.55">
      <animate attributeName="opacity" values="0.4;0.75;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#eaffff"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      <circle cx="0" cy="-76" r="4" fill="#00ffc8"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="14s" repeatCount="indefinite"/>
      <circle cx="0" cy="-46" r="3.2" fill="#7df9ff"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="90" to="450" dur="24s" repeatCount="indefinite"/>
      <circle cx="0" cy="-104" r="2.4" fill="#00b3ff"/>
    </g>
  </g>

  <g font-family="Fira Code, SF Mono, Menlo, Consolas, monospace">
    <text x="360" y="116" font-size="66" font-weight="700" letter-spacing="4" fill="url(#title)">GREYSON</text>
    <rect x="360" y="132" width="388" height="2" fill="url(#line)"/>
    <g clip-path="url(#ul)">
      <rect x="-90" y="132" width="90" height="2" fill="#ffffff" opacity="0.8">
        <animate attributeName="x" from="-90" to="390" dur="4.5s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="362" y="166" font-size="16" letter-spacing="1.6" fill="#8fa6ba">// reverse engineering · rust systems · desktop craft</text>
    <text x="362" y="206" font-size="12.5" fill="#4d6b80">$ echo $FOCUS  →  rust · c · qml · arm64e · wayland</text>

    <rect x="972" y="42" width="188" height="32" rx="16" fill="#0b1924" stroke="#1e3a4a"/>
    <circle cx="994" cy="58" r="4.5" fill="#00ffc8">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="1008" y="63" font-size="12" letter-spacing="1.2" fill="#8fd8c8">LIVE / BUILDING</text>
    <text x="1158" y="206" font-size="11.5" text-anchor="end" fill="#4d6b80" letter-spacing="1.5">CALIFORNIA · US</text>
  </g>

  <rect x="0" y="0" width="2" height="260" fill="#00ffc8" opacity="0.0">
    <animate attributeName="x" values="0;1200" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.18;0" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
