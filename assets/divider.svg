<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="900" height="24" role="img" aria-label="Section divider">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ffc8" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#00ffc8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#7df9ff" stop-opacity="0.9"/>
      <stop offset="0.75" stop-color="#00b3ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00b3ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect x="0" y="10" width="900" height="3"/></clipPath>
  </defs>
  <rect x="0" y="10" width="900" height="3" fill="url(#g)" opacity="0.35"/>
  <g clip-path="url(#c)">
    <rect x="-160" y="10" width="160" height="3" fill="#ffffff" opacity="0.85">
      <animate attributeName="x" from="-160" to="900" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <circle cy="11.5" r="3" fill="#7df9ff">
    <animate attributeName="cx" values="8;892;8" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
