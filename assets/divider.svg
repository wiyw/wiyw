<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="900" height="24" role="img" aria-label="Section divider">
  <defs>
    <clipPath id="sweep"><rect x="-160" y="0" width="160" height="24">
      <animate attributeName="x" from="-160" to="900" dur="6s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>
  <line x1="0" y1="12" x2="900" y2="12" stroke="#242b31" stroke-width="2" stroke-dasharray="3 7"/>
  <g clip-path="url(#sweep)">
    <line x1="0" y1="12" x2="900" y2="12" stroke="#f2f5f7" stroke-width="2" stroke-dasharray="3 7"/>
  </g>
</svg>
