<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">Terminal output of focus.map</title>
  <desc id="d">Animated segmented bars showing current language focus, printed in a terminal.</desc>
  <defs>
    <pattern id="segOff" width="20" height="12" patternUnits="userSpaceOnUse">
      <rect width="16" height="12" fill="#1b2227"/>
    </pattern>
    <pattern id="segOn" width="20" height="12" patternUnits="userSpaceOnUse">
      <rect width="16" height="12" fill="#e8edf0"/>
    </pattern>
  </defs>

  <rect x="4" y="4" width="1192" height="332" rx="12" fill="#080a0c" stroke="#242b31"/>
  <rect x="4" y="4" width="1192" height="40" rx="12" fill="#101417"/>
  <rect x="4" y="28" width="1192" height="16" fill="#101417"/>
  <line x1="4" y1="44" x2="1196" y2="44" stroke="#242b31"/>
  <circle cx="30" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="24" r="6" fill="#27c93f"/>
  <text x="600" y="29" text-anchor="middle" font-family="Fira Code, SF Mono, Menlo, Consolas, monospace" font-size="13" fill="#78838b">focus.map — zsh — 80×24</text>

  <g font-family="Fira Code, SF Mono, Menlo, Consolas, monospace" font-size="18">
    <text x="30" y="78"><tspan fill="#ffffff">greyson@mac</tspan><tspan fill="#6b757d"> ~ % </tspan><tspan fill="#f2f5f7">cat focus.map</tspan></text>

    <text x="30" y="116" fill="#aab4bb">rust / systems</text>
    <rect x="330" y="102" width="700" height="12" fill="url(#segOff)"/>
    <rect x="330" y="102" width="665" height="12" fill="url(#segOn)">
      <animate attributeName="width" from="0" to="665" dur="1.2s" begin="0.3s" fill="freeze"/>
    </rect>
    <text x="1160" y="116" text-anchor="end" fill="#f2f5f7">95%</text>

    <text x="30" y="156" fill="#aab4bb">c / arm64e reverse engineering</text>
    <rect x="330" y="142" width="700" height="12" fill="url(#segOff)"/>
    <rect x="330" y="142" width="602" height="12" fill="url(#segOn)">
      <animate attributeName="width" from="0" to="602" dur="1.2s" begin="0.45s" fill="freeze"/>
    </rect>
    <text x="1160" y="156" text-anchor="end" fill="#f2f5f7">86%</text>

    <text x="30" y="196" fill="#aab4bb">qml / quickshell</text>
    <rect x="330" y="182" width="700" height="12" fill="url(#segOff)"/>
    <rect x="330" y="182" width="574" height="12" fill="url(#segOn)">
      <animate attributeName="width" from="0" to="574" dur="1.2s" begin="0.6s" fill="freeze"/>
    </rect>
    <text x="1160" y="196" text-anchor="end" fill="#f2f5f7">82%</text>

    <text x="30" y="236" fill="#aab4bb">python / tooling</text>
    <rect x="330" y="222" width="700" height="12" fill="url(#segOff)"/>
    <rect x="330" y="222" width="518" height="12" fill="url(#segOn)">
      <animate attributeName="width" from="0" to="518" dur="1.2s" begin="0.75s" fill="freeze"/>
    </rect>
    <text x="1160" y="236" text-anchor="end" fill="#f2f5f7">74%</text>

    <text x="30" y="276" fill="#aab4bb">nix / shell</text>
    <rect x="330" y="262" width="700" height="12" fill="url(#segOff)"/>
    <rect x="330" y="262" width="476" height="12" fill="url(#segOn)">
      <animate attributeName="width" from="0" to="476" dur="1.2s" begin="0.9s" fill="freeze"/>
    </rect>
    <text x="1160" y="276" text-anchor="end" fill="#f2f5f7">68%</text>

    <text x="30" y="316" font-size="13" fill="#6b757d"># relative activity, recomputed from live repos</text>
  </g>
</svg>
