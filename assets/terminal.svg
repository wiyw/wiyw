<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">Terminal session: whoami --verbose</title>
  <desc id="d">A terminal window that types a command and reveals its output line by line.</desc>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <clipPath id="typed">
      <rect x="24" y="58" width="0" height="42">
        <animate attributeName="width" values="0;12;24;36;48;60;72;84;96;108;120;132;144;156;168;180;192;204;216;228;240;252;264;276;288;300;312;324;336;348;360;372;384;396;408;420" calcMode="discrete" dur="2.8s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="4" y="4" width="1192" height="332" rx="12" fill="#080a0c" stroke="#242b31"/>
  <rect x="4" y="4" width="1192" height="40" rx="12" fill="#101417"/>
  <rect x="4" y="28" width="1192" height="16" fill="#101417"/>
  <line x1="4" y1="44" x2="1196" y2="44" stroke="#242b31"/>

  <circle cx="30" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="24" r="6" fill="#27c93f"/>
  <text x="600" y="29" text-anchor="middle" font-family="Fira Code, SF Mono, Menlo, Consolas, monospace" font-size="13" fill="#78838b">greyson@mac — zsh — 120×44</text>

  <g font-family="Fira Code, SF Mono, Menlo, Consolas, monospace" font-size="21" clip-path="url(#typed)">
    <text x="30" y="88"><tspan fill="#ffffff">greyson@mac</tspan><tspan fill="#6b757d"> ~ % </tspan><tspan fill="#f2f5f7">whoami --verbose</tspan></text>
    <rect x="437" y="70" width="12" height="21" fill="#ffffff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="Fira Code, SF Mono, Menlo, Consolas, monospace" font-size="17">
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2.85s" fill="freeze"/>
      <text x="30" y="128"><tspan fill="#aab4bb">name    </tspan><tspan fill="#f2f5f7">: Greyson</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="3.05s" fill="freeze"/>
      <text x="30" y="154"><tspan fill="#aab4bb">role    </tspan><tspan fill="#f2f5f7">: systems engineer · reverse engineer</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="3.25s" fill="freeze"/>
      <text x="30" y="180"><tspan fill="#aab4bb">os      </tspan><tspan fill="#f2f5f7">: macOS (daily)</tspan><tspan fill="#6b757d">  /  </tspan><tspan fill="#f2f5f7">Arch Linux (still around)</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="3.45s" fill="freeze"/>
      <text x="30" y="206"><tspan fill="#aab4bb">focus   </tspan><tspan fill="#f2f5f7">: Rust · C · arm64e · QML · Wayland</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="3.65s" fill="freeze"/>
      <text x="30" y="232"><tspan fill="#aab4bb">work    </tspan><tspan fill="#f2f5f7">: Horizon · jb-research · SekaiPop</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="3.85s" fill="freeze"/>
      <text x="30" y="258"><tspan fill="#aab4bb">uptime  </tspan><tspan fill="#f2f5f7">: too long</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="4.05s" fill="freeze"/>
      <text x="30" y="298"><tspan fill="#ffffff">greyson@mac</tspan><tspan fill="#6b757d"> ~ % </tspan></text>
      <rect x="222" y="279" width="11" height="21" fill="#ffffff">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect x="4" y="4" width="1192" height="332" rx="12" fill="url(#scan)" pointer-events="none"/>
</svg>
